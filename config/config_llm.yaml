# API keys are referenced as ${ENV_VAR} — resolved from .env at runtime.
# Other settings live here, not in .env.

default_provider: ollama
llm_concurrent: 1

providers:

  ollama:
    # model: llama3.2          # exact tag as shown in `ollama list`
    model: qwen2.5:3b-instruct-q4_K_M
    # base_url: http://localhost:11434
    options:
      temperature: 0.2

  # gemini:
  #   model: gemini-2.0-flash
  #   api_key: ${GEMINI_API_KEY}
  #   options:
  #     temperature: 0.7
  #     max_tokens: 2048

