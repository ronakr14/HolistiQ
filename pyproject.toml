[project]
name = "holistiq"
version = "0.1.0"
description = ""
authors = [
    {name = "Ronak Rathore",email = "ronak.rathore05@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "custom-logger @ git+https://github.com/ronakr14/custom_logger.git",
    "pyyaml (>=6.0.3,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "tiktoken (>=0.13.0,<0.14.0)",
    "transformers (>=5.8.1,<6.0.0)",
    "ollama (>=0.6.2,<0.7.0)",
    "cryptography (>=48.0.0,<49.0.0)",
    "faker (>=40.18.0,<41.0.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "librosa (>=0.11.0,<0.12.0)",
    "playwright (>=1.60.0,<2.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "notify-py (>=0.3.43,<0.4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
holistiq = "holistiq:main"